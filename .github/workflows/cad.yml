name: cad

on:
  push:
    paths: ['cad/**', '.github/workflows/cad.yml']
  pull_request:
    paths: ['cad/**', '.github/workflows/cad.yml']

jobs:
  build-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e ./cad[test]
      - name: Run model build checks
        run: pytest cad/tests -v
      - name: Export STL/STEP
        run: python cad/export.py
      - uses: actions/upload-artifact@v4
        with:
          name: cad-models
          path: cad/out/
